forvantat: GODKANN
kategori: giltigt
motivering: 'Verkan är en måltid med kort eftereffekt, kontrollen ligger före verkan, effekten 1,0
  mmol/L i ett 4-timmarsfönster är rimlig att upptäcka med 14 par, och villkoren kräver ingen
  särskild dagstyp. En giltig vardagsdesign som ska passera utan stopp.'
