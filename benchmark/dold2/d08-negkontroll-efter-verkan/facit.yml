forvantat: STOPP
skal:
- tidsordning
kategori: kritiskt
motivering: 'Den negativa kontrollen 07:00–08:30 ligger efter verkans början 06:30 — simningen kan
  redan ha sänkt glukos i kontrollfönstret. En negativ kontroll som exponeringen kan påverka avslöjar
  ingen snedvridning; den måste sluta före 06:30 (natten) eller sakna mekanism.'
reparation: Flytta kontrollen till 00:00–06:00 natten före passet.
