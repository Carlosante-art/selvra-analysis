forvantat: GODKANN
kategori: giltigt
motivering: 'A förekommer aldrig i historiken, men A är interventionen och skapas med en avsiktlig
  handling — det är B som måste förekomma naturligt på de tillåtna dagarna, och det gör den (lediga
  söndagar ~2 900 steg). Att stoppa här vore att förväxla exponeringens historiska frekvens med
  dess genomförbarhet.'
