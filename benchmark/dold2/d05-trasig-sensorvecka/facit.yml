forvantat: GODKANN
kategori: giltigt
motivering: 'Täckningen är 90 % och luckorna slumpmässigt fördelade — en egenskap hos sensorn, inte hos
  lördagarna. Bortfall ska skattas på alla dagar; att slumpen lagt några luckor på tillåtna dagar i
  historiken får inte stoppa en i övrigt giltig design med god marginal i par.'
