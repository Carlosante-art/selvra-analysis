forvantat: GODKANN
kategori: giltigt
motivering: 'Perioder om tre dagar med två tvättdagar ger analyserade dagar med god marginal till
  24–48 h-eftereffekten, villkoren går alla dagar, och 10 par med 1,5 mmol/L i ett helddagsfönster
  är realistiskt. En korrekt hanterad överföring ska inte stoppas.'
