id: d07-perfekt-utom-overforing
titel: Promenad varannan dag med stor väntad effekt
fraga: Hur mycket lägre är medelglukos 09–24 en dag med minst 10 000 steg jämfört med en vanlig dag?
tes: En dag med minst 10 000 steg ger minst 2,0 mmol/L lägre medelglukos 09–24.
motbevis: Hela intervallet ligger över −2,0 mmol/L.
design:
  typ: n1
  A: Minst 10 000 steg, varav en promenad 60–90 minuter med start 09:00–11:00
  B: Vanlig dag, högst 5 000 steg
  start: 2025-07-07
  par: 18
  periodlangd_dagar: 1
  tvatt_dagar: 0
  foljsamhet:
    kolumn: steps
    A:
      min: 10000
    B:
      max: 5000
  verkan:
    typ: traning
    borjar: 09:00
  dagar:
    datum: [2025-07-07, 2025-07-08, 2025-07-09, 2025-07-10, 2025-07-11, 2025-07-12, 2025-07-14,
            2025-07-15, 2025-07-16, 2025-07-17, 2025-07-18, 2025-07-19, 2025-07-21, 2025-07-22,
            2025-07-23, 2025-07-24, 2025-07-25, 2025-07-26, 2025-07-28, 2025-07-29, 2025-07-30,
            2025-07-31, 2025-08-01, 2025-08-02, 2025-08-04, 2025-08-05, 2025-08-06, 2025-08-07,
            2025-08-08, 2025-08-09, 2025-08-11, 2025-08-12, 2025-08-13, 2025-08-14, 2025-08-15, 2025-08-16]
    minsta_avstand: 1
  dagar_motivering: Jag är hemma hela sommaren och kan promenera eller vila vilken dag som helst.
  genomforbarhet: A görs som planerad promenad, B är en vilodag — båda går alla dagar.
utfall:
  matt: medel
  fonster:
  - 09:00
  - '23:59'
  min_tackning_pct: 70
analys:
  metod: randomiseringstest
  niva: 0.95
  minsta_relevanta_effekt: -2.0
protokoll:
  periodeffekt: Paren ligger nära i tid och ordningen lottas; långsam drift drabbar A och B lika.
  overforing: Ordningen lottas; AB och BA redovisas separat.
  stoppregel: Insulin ändras aldrig för studien. Paus vid hypoglykemi nivå 2 (<3,0 mmol/L ≥15 min) kopplad till A, ketoner ≥1,5 eller sjukdom.
  andringslogg: []
negativ_kontroll:
  matt: medel
  fonster:
  - 00:00
  - 06:00
  motivering: Natten före dagens promenad.
