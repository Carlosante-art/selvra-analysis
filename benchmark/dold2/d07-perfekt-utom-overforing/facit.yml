forvantat: STOPP
skal:
- overforing
kategori: kritiskt
motivering: 'Allt annat är exemplariskt — 18 par, stor minsta effekt, korrekt negativ kontroll — men
  studiedagarna ligger intill varandra och insulinkänsligheten är förhöjd 24–48 h efter aktivitet
  (Riddell 2017). En B-dag direkt efter en A-dag bär A:s eftereffekt, och den negativa kontrollen
  natten före en dag som följer på A är också kontaminerad. Styrka kan inte köpa bort överföring.'
reparation: Minst tre kalenderdagar mellan analyserade dagar, eller tvättdagar mellan perioderna.
