id: d03-obs-dagtyp-natt
titel: Höga steg och natten efter, rullande schema
fraga: Är medelglukos 00–06 lägre natten efter en dag med minst 10 000 steg?
tes: Minst 0,5 mmol/L lägre medel 00–06 natten efter en hoga_steg-dag.
motbevis: Hela intervallet över −0,5 mmol/L.
design:
  typ: observation
  exponering:
