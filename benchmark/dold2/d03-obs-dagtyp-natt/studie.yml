  fonster:
  - 00:00
  - 06:00
analys:
  metod: blockbootstrap
  blocklangd: 7
  niva: 0.95
  minsta_relevanta_effekt: -0.5
  minsta_underlag:
    exponerade: 10
    jamforelse: 10
protokoll:
  periodeffekt: Block om sju dagar bevarar veckorytmen.
  andringslogg: []
negativ_kontroll:
  matt: medel
  fonster:
  - 06:00
  - 08:00
