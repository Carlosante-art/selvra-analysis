id: d11-obs-gles-sensor
titel: Träning och natten efter med gles sensordata
fraga: Är medelglukos 00–06 lägre natten efter loggad träning?
tes: Minst 0,5 mmol/L lägre medel 00–06 natten efter träning.
motbevis: Hela intervallet över −0,5 mmol/L.
design:
  typ: observation
  exponering:
    handelse: traning
    dagar_efter: 1
  period:
  - 2025-04-01
  - 2025-06-30
  retrospektiv: true
utfall:
  matt: medel
  fonster:
  - 00:00
  - 06:00
analys:
  metod: blockbootstrap
  blocklangd: 7
  niva: 0.95
  minsta_relevanta_effekt: -0.5
  minsta_underlag:
    exponerade: 15
    jamforelse: 30
protokoll:
  periodeffekt: Block om sju dagar bevarar veckorytmen.
  andringslogg: []
negativ_kontroll:
  matt: medel
  fonster:
  - 06:00
  - 08:00
  motivering: Morgonen samma dag som träningen — passet har inte ägt rum ännu.
