forvantat: STOPP
skal: [tidsordning]
kategori: reparerbart
motivering: Den negativa kontrollen 06:00–09:00 beskrivs som "före passet", men passet startar 07:00 (verkan.borjar) och frukosten 08:00. Två av tre timmar ligger efter exponeringen, och aerob träning sänker glukos redan inom ca 45 minuter (t1d §1, Riddell 2017). En negativ kontroll måste vara ett utfall exponeringen inte kan påverka (Lipsitch 2010 via kausal_validitet Q3; designgranskning_n1 §5 O5, "a glucose window before the intervention time on the same day"). Här skulle kontrollen visa en "effekt" även utan confounding. Övrigt är giltigt; lediga dagar där båda villkoren förekommit, minst tre dagars avstånd, 12 par med låg variation.
reparation: Lägg den negativa kontrollen helt före 07:00, t.ex. 00:00–06:00 eller 03:00–06:30.
