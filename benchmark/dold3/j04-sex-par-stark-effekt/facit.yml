forvantat: GODKANN
flagga: []
kategori: giltigt
motivering: Sex par är det lägsta antal där tvåsidigt α = 0,05 alls går att nå (2/2^6 ≈ 0,031; designgranskning_n1 §6, kausal_validitet Q2), så en försiktig granskare kan vilja stoppa för få par. Men minimikravet är uppfyllt, SPENT 14 (minst 3 block) och WWC (minst 5 upprepningar) är uppfyllda, och styrkan är god eftersom personens dag-till-dag-variation är låg (sd 0,4) i förhållande till minsta relevanta effekt 1,5 mmol/L. Utan arbetsschema går båda villkoren varje dag (positivitet), minsta avstånd 3 dagar ger mer än 48 timmar efter träning (t1d §1), och den negativa kontrollen ligger före verkan.
