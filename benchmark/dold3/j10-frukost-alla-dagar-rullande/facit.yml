forvantat: GODKANN
flagga: []
kategori: giltigt
motivering: En försiktig granskare kan vilja stoppa för att arbets- och lediga dagar blandas i paren (dagtyp), för att det saknas tvättdag, eller för att täckningen bara är 85 procent. Men båda frukostarna går att genomföra på varje dagstyp (positivitet uppfylld i alla strata, designgranskning_n1 §2 F1), och ordningen lottas inom varje par. Dagtypen kan därför inte skilja A från B systematiskt (Daza 2018, "ignorability is implied if the treatment is randomized"). Att para inom dagstyp minskar bruset men krävs inte. En måltids effekt är akut, och washout behövs inte när verkan är kort i förhållande till perioden (AHRQ, designgranskning_n1 §4). 20 par med ca 72 procent kompletta par ger ca 14 par, och med effekt 1,5 och sd 0,9 är styrkan god (§6 S1–S2). Den negativa kontrollen ligger före frukosten.
