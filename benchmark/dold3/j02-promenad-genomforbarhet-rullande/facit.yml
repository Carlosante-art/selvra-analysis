forvantat: GODKANN
flagga: []
kategori: giltigt
motivering: A (minst 10 000 steg) har aldrig förekommit på en ledig dag, vilket en försiktig granskare kan läsa som ett positivitetsbrott. Men positivitet i ett randomiserat försök gäller om villkoret kan genomföras på varje tillåten dag, inte om det har inträffat av sig självt (designgranskning_n1 §2 F1/F5; WWC kräver att den oberoende variabeln manipuleras aktivt). genomforbarhet förklarar hur A uppnås med en planerad promenad, och B är personens vanliga lediga dag. Dagarna är begränsade till lediga dagar där båda villkoren går (F2, kausal_validitet Q2 "restricting to eligible days"), avståndet är minst tre dagar vilket uppfyller 48 timmars-rådet för träning (t1d §1, Riddell 2017), den negativa kontrollen ligger före verkan, och 12 par med den låga variationen räcker.
