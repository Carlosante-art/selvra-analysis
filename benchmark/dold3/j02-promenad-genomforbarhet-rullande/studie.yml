id: j02-promenad-genomforbarhet-rullande
titel: Förmiddagspromenad på lediga dagar och eftermiddagsglukos
fraga: Sänker en 90 minuters promenad på förmiddagen en ledig dag medelglukos 13–19 med minst 1,0 mmol/L jämfört med en vanlig ledig dag?
tes: Promenaden sänker medelglukos 13–19 med minst 1,0 mmol/L.
motbevis: Hela intervallet visar en sänkning mindre än 1,0 mmol/L (eller ingen).

design:
  typ: n1
  A: Promenad 90 min i rask takt, start 10:00 ± 15 min, minst 10 000 steg under dagen
  B: Ingen promenad, en vanlig ledig dag med högst 6 000 steg
  start: 2025-07-02
  par: 12
  periodlangd_dagar: 1
  tvatt_dagar: 0
  dagar:
    datum: [2025-07-02, 2025-07-06, 2025-07-10, 2025-07-15, 2025-07-20, 2025-07-24,
            2025-07-29, 2025-08-03, 2025-08-07, 2025-08-12, 2025-08-17, 2025-08-21,
            2025-08-26, 2025-08-31, 2025-09-04, 2025-09-09, 2025-09-14, 2025-09-18,
            2025-09-23, 2025-09-28, 2025-10-02, 2025-10-07, 2025-10-12, 2025-10-16]
    minsta_avstand: 3
  dagar_motivering: Bara lediga dagar ur det rullande schemat (2 på, 2 av, 3 på, 3 av, 2 på, 2 av). På arbetsdagar går jag ca 13 000 steg som undersköterska och B går inte att genomföra. Minst tre kalenderdagar mellan studiedagarna ger mer än 48 timmar efter en promenad innan nästa studiedags fönster.
  genomforbarhet: A har aldrig förekommit på en ledig dag (vanligen ca 3 800 steg). Den uppnås med en planerad promenad, 90 min i ca 110 steg per minut ger ca 9 900 steg utöver basen, alltså ca 13 000 under dagen. B är en vanlig ledig dag.
  foljsamhet:
    kolumn: steps
    A: {min: 10000}
    B: {max: 6000}
  verkan:
    typ: traning
    borjar: "10:00"

utfall:
  matt: medel
  fonster: ["13:00", "19:00"]
  min_tackning_pct: 70

analys:
  metod: randomiseringstest
  niva: 0.95
  minsta_relevanta_effekt: -1.0

protokoll:
  periodeffekt: Paren består av två närliggande lediga dagar (4–5 dagar isär), så långsam drift påverkar båda villkoren i ett par lika. Schemat lottas en gång vid låsning.
  overforing: Minst tre kalenderdagar mellan studiedagar (minst 48 timmar efter promenaden enligt Riddell 2017). Inga studiedagar intill varandra.
  stoppregel: Promenaden startas inte under 5,0 mmol/L (10–20 g kolhydrater först). Avbryts vid hypoglykemi nivå 2 under eller efter promenaden, svår hypoglykemi senaste dygnet eller ketoner minst 1,5 mmol/L; avbrott redovisas.
  andringslogg: []

negativ_kontroll:
  matt: medel
  fonster: ["00:00", "06:00"]
  motivering: Natten före studiedagen kommer före förmiddagens promenad och kan inte påverkas av dagens villkor; föregående studiedag ligger minst tre dagar bort.
