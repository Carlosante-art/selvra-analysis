forvantat: GODKANN
flagga: [apparat]
kategori: giltigt
motivering: Designen är giltig. Lördagar är lediga, båda stegnivåerna har förekommit eller förklaras i genomforbarhet, en veckas avstånd ger ingen överföring, den negativa kontrollen ligger före verkan och 10 par räcker vid sd 0,6. Villkoret verifieras dock med steg, och stegdatan bytte apparat 2025-06-10 (Oura till Garmin, bara tre veckor Garmin). Trösklarna 11 000 och 7 000 och den historiska kontrollen av att villkoren går är alltså gjorda på blandade apparater, medan studien mäts med Garmin. Anteckningarna kräver samma apparat och algoritm genom hela mätningen (t1d §5–6, Battelino 2023) och att analysen bryts vid apparatbyten (kausal_validitet Q3 punkt 6; Q1 stationaritet, "fix device ... during the study, or log changes"). Eftersom hela studien mäts med en apparat är det en varning, inte ett stopp.
