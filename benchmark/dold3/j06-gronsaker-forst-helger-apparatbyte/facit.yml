forvantat: GODKANN
flagga: []
kategori: giltigt
motivering: Personen bytte från Oura till Garmin 2025-05-20, vilket kan få en granskare att stoppa för apparat. Men villkoret mäts inte med wearablen (foljsamhet manuell) och utfallet kommer från CGM, så apparatbytet påverkar varken villkoret eller utfallet. Regeln om samma apparat gäller mätningen av det som analyseras (t1d §5–6, Battelino 2023). Helger är lediga dagar för ett vardagsschema och båda villkoren går (positivitet, designgranskning_n1 §2). Effekten av en måltid är akut, så parade dagar intill varandra är rimliga (AHRQ, washout behövs inte om verkan är kort i förhållande till perioden). Den negativa kontrollen ligger före middagen och 16 par räcker vid sd 0,6.
