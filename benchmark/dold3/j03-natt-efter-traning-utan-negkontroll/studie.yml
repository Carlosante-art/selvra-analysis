id: j03-natt-efter-traning-utan-negkontroll
titel: Träning och natten efter (observation)
fraga: Är medelglukos 00–06 natten efter en träningsdag minst 0,5 mmol/L lägre än andra nätter?
tes: Natten efter en loggad träningsdag är medelglukos 00–06 minst 0,5 mmol/L lägre än övriga nätter.
motbevis: Hela intervallet visar en skillnad mindre än 0,5 mmol/L (eller ingen).

design:
  typ: observation
  exponering: {handelse: traning, dagar_efter: 1}
  period: [2025-04-01, 2025-06-30]
  retrospektiv: true

utfall:
  matt: medel
  fonster: ["00:00", "06:00"]
  min_tackning_pct: 70

analys:
  metod: blockbootstrap
  blocklangd: 7
  niva: 0.95
  minsta_relevanta_effekt: -0.5
  minsta_underlag: {exponerade: 15, jamforelse: 30}

protokoll:
  periodeffekt: Blockbootstrap med sjudagarsblock hanterar autokorrelation. Träning förekommer lika ofta på arbets- och lediga dagar i perioden. Resultatet redovisas som samband, inte orsak.
  andringslogg: []
