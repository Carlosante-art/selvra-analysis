forvantat: GODKANN
kategori: giltigt
motivering: 'Som f17 men med 3,6 mmol/L mellan dagstyperna: blandningens SD blir ~1,8 medan
  dag-till-dag-SD inom lördagar är 0,9. Studien jämför enbart lördagar mot lördagar, så skillnaden
  mellan dagstyper är inte brus för den. Sann styrka för 1,5 mmol/L med 14 par är ~97 %; poolningen
  får den att se hopplös ut. Variationen ska skattas inom dagstyp.'
