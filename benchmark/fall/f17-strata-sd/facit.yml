forvantat: GODKANN
kategori: giltigt
motivering: 'Lördagarna i historiken är ~13 — under MIN_SD_DAYS — så variationen poolas över alla
  dagar. Men arbetsdagar ligger 2,4 mmol/L högre än lediga (glukos.arbete), och den skillnaden är
  inte brus för en studie som enbart jämför lördagar mot lördagar: inom lördagar är dag-till-dag-SD
  0,9 och den sanna styrkan för 1,5 mmol/L med 14 par hög. Variationen ska skattas inom dagstyp
  (residualer efter dagstypens medel), inte som blandningens totala SD.'
