id: f05-rullande-ologgat
titel: Långpromenad en ledig dag och dagens glukos
fraga: Hur mycket lägre är medelglukos 09–24 en ledig dag med minst 10 000 steg jämfört med en vanlig ledig dag?
tes: En ledig dag med minst 10 000 steg ger minst 1,5 mmol/L lägre medelglukos 09–24.
motbevis: Hela intervallet ligger över −1,5 mmol/L.
design:
  typ: n1
  A: Minst 10 000 steg, varav en promenad på 60–90 minuter med start 09:00–11:00
  B: Vanlig ledig dag, högst 5 000 steg, ingen planerad promenad
