id: h12-eftermiddagspromenad
titel: Eftermiddagspromenad och glukos före middagen
fraga: Sänker en promenad på 45 minuter kl 15:00 medelglukos 16:00–18:00 jämfört med att sitta kvar?
tes: Promenaden sänker medelglukos 16:00–18:00 med minst 1,0 mmol/L.
motbevis: Hela intervallet visar en sänkning mindre än 1,0 mmol/L (eller ingen).

design:
  typ: n1
  A: Promenad 45 minuter i rask takt, start 15:00 ± 15 min. Middag 18:30.
  B: Ingen promenad; sitter kvar 15:00–18:00. Middag 18:30.
  start: 2025-07-07
  par: 8
  periodlangd_dagar: 1
  tvatt_dagar: 0
  dagar: {veckodagar: [mandag, torsdag]}
  dagar_motivering: Måndag och torsdag arbetar jag hemifrån och kan styra eftermiddagen. De ligger minst tre dygn isär, så promenadens eftereffekt hinner klinga av före nästa studiedag.
  genomforbarhet: Jag går normalt omkring 5 000 steg om dagen. Promenaden på 45 minuter ger ungefär 5 000 steg till, så A:s tröskel nås med promenaden och sällan utan den.
  foljsamhet:
    kolumn: steps
    A: {min: 9000}
    B: {max: 6000}
  verkan:
    typ: traning
    borjar: "15:00"

utfall:
  matt: medel
  fonster: ["16:00", "18:00"]
  min_tackning_pct: 70

analys:
  metod: randomiseringstest
  niva: 0.95
  minsta_relevanta_effekt: -1.0

protokoll:
  periodeffekt: Varje par är måndag och torsdag samma vecka; långsam drift påverkar båda villkoren i ett par lika.
  overforing: Minst tre dygn mellan studiedagar; skattningen redovisas separat för AB- och BA-par.
  stoppregel: Promenaden startar bara om glukos är över 5,0 mmol/L. Avbryts vid hypoglykemi nivå 2 (under 3,0 mmol/L i minst 15 min) som kan knytas till A, svår hypoglykemi, ketoner 1,5 eller högre eller sjukdom; avbrott redovisas.
  andringslogg: []

negativ_kontroll:
  matt: medel
  fonster: ["07:00", "10:00"]
  motivering: Morgonen kommer före eftermiddagens promenad samma dag, och föregående studiedag ligger minst tre dygn bakåt.
