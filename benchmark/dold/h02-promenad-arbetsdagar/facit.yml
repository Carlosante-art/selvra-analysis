forvantat: GODKANN
flagga: []
kategori: giltigt
motivering: >-
  Ser ut som stegexemplet men är dess reparation. Alla studiedagar är arbetsdagar (vardagar-schema,
  måndag och torsdag), så båda villkoren ligger i samma stratum. B (högst 12 000) förekommer
  naturligt på de flesta arbetsdagar, och A (minst 14 000) definieras relativt arbetsdagens
  baslinje och nås genom en konkret promenad som genomforbarhet beskriver. Det är precis den
  lösning forskningen anger: "Redefine levels so both are feasible in each stratum (e.g., A =
  +4,000 steps over that day type's personal baseline, B = baseline), or restrict to one stratum"
  (designgranskning_n1 §2 F1; kausal_validitet Q2 "Stratified alternative"). Minst tre dygn mellan
  studiedagar uppfyller ≥48 h (t1d_designfaktorer §1). Morgonfönstret ligger före promenaden.
  Variationen (sd 0,5) mot effekten 1,0 med 8 par ger god styrka och minsta p 1/256.
