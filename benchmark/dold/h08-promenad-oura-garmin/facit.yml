forvantat: GODKANN
flagga: [apparat]
kategori: giltigt
motivering: >-
  Designen är giltig: samma dagstyp alla dagar, B förekommer naturligt, A nås med en konkret
  promenad, minst tre dygn mellan studiedagar, morgonkontrollen ligger före promenaden, och sd 0,5
  mot effekten 1,0 med 8 par ger god styrka. Men stegdatan som följsamheten och positiviteten
  bedöms från kommer från Oura före 2025-05-15 och Garmin efter, så trösklarna 9 000/7 000 är
  kalibrerade på två olika mätare. Forskningen: använd samma apparat genom hela studien eller logga
  bytet (kausal_validitet Q1 Stationarity: "Fix device and regimen during the study, or log
  changes"; t1d_designfaktorer §5–6, Battelino "same device and algorithm throughout"). Studien
  själv löper på en apparat (Garmin), så det är en varning, inte ett stopp.
