forvantat: GODKANN
flagga: []
kategori: giltigt
motivering: >-
  En retrospektiv observationsstudie utan dagstypsförväxling: personen har inget arbetsschema och
  tränar med samma sannolikhet alla dagar, så exponerade nätter och jämförelsenätter kommer från
  samma kontext (kausal_validitet Q3 punkt 1, kontextmatchad jämförelse). Utfallet ligger efter
  exponeringen (natten efter träningsdagen; t1d_designfaktorer §1: nattlig risk efter träning).
  Med p 0,35 över 91 dagar väntas omkring 30 exponerade och 60 jämförelsenätter, över det låsta
  minsta_underlag. Blockbootstrap hanterar autokorrelation. Tolkningen är samband, inte orsak, vilket
  formatet redan säger; det är ingen anledning att stoppa.
