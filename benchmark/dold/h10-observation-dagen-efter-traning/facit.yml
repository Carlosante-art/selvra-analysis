forvantat: STOPP
skal: [dagtyp, positivitet]
kategori: kritiskt
motivering: >-
  Personen tränar bara på lediga dagar, och i det rullande schemat följs varje ledig dag av en
  arbetsdag. Alla analyserade "dagen efter träning" är därför arbetsdagar, medan ungefär hälften av
  jämförelsedagarna är lediga. Arbetsdagar har omkring 1,5 mmol/L högre dagglukos, så jämförelsen
  mäter arbete mot ledighet, inte träning. Det finns ingen exponerad ledig dag alls (en nollcell):
  "Any zero cell means a structural violation" (kausal_validitet Q1, positivitet), och för
  observationsstudier krävs kontextmatchad jämförelse: "Compare 'days after event' with other days
  of the same context: workday vs workday ... Do not compare against all other days. The circular
  block bootstrap handles autocorrelation, but it does not remove confounding" (kausal_validitet Q3
  punkt 1; designgranskning_n1 §2 F3).
reparation: >-
  Jämför bara arbetsdagar med arbetsdagar (dagen efter träning mot arbetsdagar som inte följer
  träning) och begränsa påståendet till arbetsdagar, eller gå direkt till ett n1-experiment med
  lottad träning inom samma dagstyp.
