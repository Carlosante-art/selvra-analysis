id: h10-observation-dagen-efter-traning
titel: Dagen efter träning (observation)
fraga: Är medelglukos 07:00–23:00 dagen efter en träningsdag lägre än övriga dagar?
tes: Dagen efter träning är medelglukos 07:00–23:00 minst 0,5 mmol/L lägre än andra dagar.
motbevis: Hela intervallet visar en skillnad mindre än 0,5 mmol/L (eller ingen, eller högre).

design:
  typ: observation
  exponering: {handelse: traning, dagar_efter: 1}
  period: [2025-04-01, 2025-06-30]
  retrospektiv: true

utfall:
  matt: medel
  fonster: ["07:00", "23:00"]
  min_tackning_pct: 70

analys:
  metod: blockbootstrap
  blocklangd: 7
  niva: 0.95
  minsta_relevanta_effekt: -0.5
  minsta_underlag: {exponerade: 15, jamforelse: 30}

protokoll:
  periodeffekt: Blockbootstrap med veckoblock tar hand om autokorrelation; resultatet redovisas också per månad för att se drift (säsong, sensorålder).
  andringslogg: []
