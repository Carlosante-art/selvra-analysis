forvantat: GODKANN
flagga: []
kategori: giltigt
motivering: >-
  Ovanlig form men korrekt: en datumlista ur ett rullande schema. Varje datum är en ledig dag enligt
  14-dagarscykeln (kontrollerat från start 2025-04-01), så båda villkoren ligger i samma stratum
  ("restrict to one stratum", designgranskning_n1 §2 F1/F2; kausal_validitet Q2: eligibility
  bestäms i förväg från arbetsschemat, inte efter hur dagen känns). B förekommer naturligt på
  lediga dagar; A nås med en konkret promenad (genomforbarhet). Minsta avstånd två dygn ger ≥48 h
  efter en lugn 25-minuterspromenad (t1d_designfaktorer §1–2: kort carryover för lätt gång). Hantering
  av schemaändringar är förregistrerad (§2 F6). Morgonkontrollen ligger före promenaden. sd 0,4 mot
  effekten 0,8 med 8 par ger god styrka. Studien ligger helt efter idag.
