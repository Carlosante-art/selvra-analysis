forvantat: GODKANN
flagga: []
kategori: giltigt
motivering: >-
  Ser ovanligt ut (träning som förväntas höja glukos, positiv minsta_relevanta_effekt) men är
  korrekt. Forskningen säger att "Sprinting or heavy lifting: glucose typically rises" och att HIIT
  dämpar den aeroba sänkningen (Riddell 2017 i t1d_designfaktorer §1), så tecknet +0,8 (A minus B)
  är den förväntade riktningen, inte ett skrivfel. Fönstret 17:30–19:30 ligger efter passet och före
  middagen; morgonfönstret före passet är en riktig negativ kontroll. Minst tre dygn mellan
  studiedagar uppfyller ≥48 h. B förekommer naturligt; A nås med ett konkret, stegmätbart pass
  (genomforbarhet). Stoppregeln följer Riddells startgränser och Battelinos nivå 2.
