id: 003-styrka-somn
titel: Långt styrkepass och nattens sömn
fraga: Är nattsömnen längre efter en dag med minst 60 minuters styrketräning jämfört
  med en vilodag?
tes: En dag med minst 60 minuters styrketräning ger minst 30 minuter längre nattsömn.
motbevis: Hela intervallet visar mindre än 30 minuters förlängning, eller kortare
  sömn.
design:
  typ: n1
  A: Styrketräning minst 60 minuter, startad på klockan, avslutad före 20:00
  B: 'Vilodag: ingen startad aktivitet, högst 15 minuter registrerad träning'
  start: 2026-11-02
  par: 12
  periodlangd_dagar: 1
  tvatt_dagar: 0
  foljsamhet:
    kolumn: garmin_traningsminuter
    A:
      min: 60
    B:
      max: 15
  verkan:
    typ: traning
    borjar: '16:00'
  dagar:
    datum:
    - 2026-11-02
