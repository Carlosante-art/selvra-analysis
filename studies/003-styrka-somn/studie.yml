    minsta_avstand: 3
  dagar_motivering: Tre dagars mellanrum täcker träningsvärk och eftereffekt på sömnbehovet.
  genomforbarhet: A kräver ett planerat gympass; B är en naturlig dag utan startad
    aktivitet.
utfall:
  kolumn: total_sleep_seconds
  dagar_efter: 1
analys:
  metod: randomiseringstest
  niva: 0.95
  minsta_relevanta_effekt: 1800
protokoll:
  periodeffekt: Ordningen lottas; säsongsdrift i sömn drabbar A och B lika.
  overforing: Minst tre kalenderdagar mellan studiedagar.
  stoppregel: Avbryt vid sjukdom eller skada; passet är frivilligt varje gång.
