version: 2

models:
  - name: int_cgm_readings
    description: All readings from both sources. Clarity is used where it exists; Share only after the last Clarity reading, so no reading is counted twice.
    columns:
      - name: reading_id
        tests: [unique, not_null]
      - name: reading_at
        tests: [unique, not_null]
      - name: data_source
        tests:
          - accepted_values:
              arguments:
                values: ['clarity', 'dexcom_share', 'nightscout']

  - name: int_cgm_segments
    description: Readings with gaps, contiguous segments and inferred sensor sessions.
    columns:
      - name: reading_id
        tests: [unique, not_null]
      - name: gap_minutes
        tests:
          - between:
              arguments:
                min_value: 0
                max_value: 1000000

  - name: int_cgm_flagged
    description: Readings with artefact flags. Nothing is removed.
    columns:
      - name: reading_id
        tests: [unique, not_null]
      - name: flag_compression_low
        description: "Interpreted (heuristic): night-time run below 3.9 mmol/L, reached by a drop of 2.0+ mmol/L within ~20 min, lasting at most 45 min, recovering to within 1.0 of the pre-drop value within 45 min."
        tests: [not_null]
      - name: flag_implausible_jump
        tests: [not_null]

  - name: int_glycaemic_events
    description: >
      Consensus 2023 hypo- and hyperglycaemic events (Battelino et al., Lancet Diabetes Endocrinol
      2023, Table 4), one row per event, on raw readings within recording segments. Identical to
      iglu's event classifier on the same readings (make validate).
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ['hypo_level1', 'hypo_level2', 'hypo_extended', 'hyper_level1', 'hyper_level2']
      - name: n_readings
        tests:
          - between:
              arguments:
                min_value: 3
                max_value: 1000000
      - name: contains_artefact
        description: The event includes a reading flagged as compression low or implausible jump.
        tests: [not_null]


  - name: int_wearable_daily
    description: >
      One wearable row per day from whichever source has data (Oura or Garmin; Garmin wins
      a tie). wearable_source states which device produced each row.
    columns:
      - name: reading_date
        tests: [unique, not_null]
      - name: wearable_source
        tests:
          - accepted_values:
              arguments:
                values: ['oura', 'garmin']
