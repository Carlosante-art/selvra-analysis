version: 2

unit_tests:
  - name: int_glycaemic_events_consensus_2023
    model: int_glycaemic_events
    description: >
      Known readings, known events (Battelino et al. 2023, Table 4). Segment 1: a level 1 hypo
      interrupted by two readings back in range, which is too short to end it; two readings below
      range, too short to start one; 26 readings below 3.0 (130 min, so also extended), whose
      level 2 event ends at the first 15 min at or above 3.0 while level 1 continues until
      15 min at or above 3.9; a hyper event cut off by the end of the segment. Segment 2 is
      short and above 13.9 throughout. One reading is a flagged artefact.
    given:
      - input: ref('int_cgm_flagged')
        rows:
          - {reading_id: s1r01, reading_at: '2025-01-01 00:00:00+00', reading_at_local: '2025-01-01 00:00:00', reading_date: '2025-01-01', glucose_mmol: 5.0, segment_id: 1, flag_compression_low: false, flag_implausible_jump: false}
