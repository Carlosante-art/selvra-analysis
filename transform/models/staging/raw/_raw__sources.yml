version: 2

sources:
  - name: raw
    schema: raw
    description: Raw tables loaded by the ingestion scripts. Text as-is; typing happens in staging.
    tables:
      - name: clarity_events
        description: One row per row in an export, all event types. Overlapping exports produce duplicates here by design.
        columns:
          - name: event_type
            tests:
              - not_null
      - name: share_readings
        # Live data from Selvra Diabetes: a new reading every 5 minutes. Checked by
        # `make verify-real` on real data, never in CI (CI has no real data).
        config:
          loaded_at_field: reading_at
          freshness:
            warn_after: {count: 30, period: minute}
            error_after: {count: 24, period: hour}
        description: >
          Readings collected by Selvra Diabetes from Dexcom Share, loaded from Supabase.
          Exact UTC instants, mg/dL as Dexcom measures them. No transmitter ID, no backfill.
        columns:
          - name: reading_at
            tests: [not_null, unique]
          - name: value_mgdl
            tests: [not_null]
      - name: oura_sleep
        description: >
          Oura Ring, one row per day: daily sleep and readiness scores, measured values
          from the main sleep period, and the day's step count. Loaded by ingest_oura when OURA_TOKEN is set; an empty
          table otherwise. Optional source: no freshness check.
      - name: garmin_activities
        description: >
          Garmin Connect, one row per started activity: start time, type, duration,
          distance and average heart rate. Loaded alongside the daily fetch; an empty
          table otherwise. Optional source: no freshness check.
      - name: garmin_daily
        description: >
          Garmin Connect, one row per day: sleep score, sleep durations, night HRV average,
          daily resting heart rate and steps. Loaded by ingest_garmin when GARMIN_EMAIL and
          GARMIN_PASSWORD are set; an empty table otherwise. Optional source: no freshness check.
      - name: nightscout_entries
        description: >
          Nightscout sgv readings from the user's own instance: exact UTC instants, mg/dL.
          Loaded by ingest_nightscout when NIGHTSCOUT_URL is set; an empty table otherwise.
          Optional source: no freshness check.
      - name: nightscout_treatments
        description: >
          Nightscout treatments: bolus insulin, carbs and temp basals as the pump, loop or a
          manual entry recorded them. Loaded with nightscout_entries. Optional source: no
          freshness check.
      - name: personal_events
        description: The personal event log (handelser.csv), validated at ingestion. Self-reported context.
        columns:
          - name: typ
            tests:
              - accepted_values:
                  arguments:
                    values: ['sjukdom', 'sensorbyte', 'alkohol', 'traning', 'resa', 'stress', 'menstruation', 'medicinandring', 'arbete', 'annat']
