version: 2

# Daylight saving time, Europe/Stockholm. Known wall times in, known instants out.
unit_tests:
  - name: stg_clarity_readings_daylight_saving
    model: stg_clarity_readings
    description: >
      Autumn 2025-10-26: 02:00-02:59 occurs twice. File f1 orders by transmitter time and the
      second pass is one second later than the first (clock drift), so it is found by the wall
      clock jumping back, not by identical timestamps. File f2 is an overlapping copy of f1 and
      must deduplicate. File f3 has no transmitter time and identical wall times, so the second
      pass is found by the repeat. Spring 2025-03-30: 02:30 does not exist and is flagged.
    given:
      - input: source('raw', 'clarity_events')
        rows:
          - {source_file: f1, source_row: '1', ts_raw: '2025-10-26T01:55:30', transmitter_time_raw: '1000', event_type: EGV, glucose_raw: '6.0', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f1, source_row: '2', ts_raw: '2025-10-26T02:00:30', transmitter_time_raw: '1300', event_type: EGV, glucose_raw: '6.1', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f1, source_row: '3', ts_raw: '2025-10-26T02:30:30', transmitter_time_raw: '3100', event_type: EGV, glucose_raw: '6.2', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f1, source_row: '4', ts_raw: '2025-10-26T02:55:30', transmitter_time_raw: '4600', event_type: EGV, glucose_raw: '6.3', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f1, source_row: '5', ts_raw: '2025-10-26T02:00:31', transmitter_time_raw: '4901', event_type: EGV, glucose_raw: '6.4', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f1, source_row: '6', ts_raw: '2025-10-26T02:30:31', transmitter_time_raw: '6701', event_type: EGV, glucose_raw: '6.2', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f1, source_row: '7', ts_raw: '2025-10-26T03:00:31', transmitter_time_raw: '8501', event_type: EGV, glucose_raw: '6.6', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f2, source_row: '1', ts_raw: '2025-10-26T02:30:30', transmitter_time_raw: '3100', event_type: EGV, glucose_raw: '6.2', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f2, source_row: '2', ts_raw: '2025-10-26T02:00:31', transmitter_time_raw: '4901', event_type: EGV, glucose_raw: '6.4', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f2, source_row: '3', ts_raw: '2025-10-26T02:30:31', transmitter_time_raw: '6701', event_type: EGV, glucose_raw: '6.2', glucose_unit: mmol/L, transmitter_id: T}
          - {source_file: f3, source_row: '1', ts_raw: '2025-10-26T02:10:00', transmitter_time_raw: '', event_type: EGV, glucose_raw: '5.0', glucose_unit: mmol/L, transmitter_id: U}
          - {source_file: f3, source_row: '2', ts_raw: '2025-10-26T02:10:00', transmitter_time_raw: '', event_type: EGV, glucose_raw: '5.0', glucose_unit: mmol/L, transmitter_id: U}
          - {source_file: f1, source_row: '8', ts_raw: '2025-03-30T01:55:00', transmitter_time_raw: '', event_type: EGV, glucose_raw: '7.0', glucose_unit: mmol/L, transmitter_id: S}
          - {source_file: f1, source_row: '9', ts_raw: '2025-03-30T02:30:00', transmitter_time_raw: '', event_type: EGV, glucose_raw: '7.1', glucose_unit: mmol/L, transmitter_id: S}
          - {source_file: f1, source_row: '10', ts_raw: '2025-03-30T03:00:00', transmitter_time_raw: '', event_type: EGV, glucose_raw: '7.2', glucose_unit: mmol/L, transmitter_id: S}
          - {source_file: f1, source_row: '11', ts_raw: '2025-07-01T12:00:00', transmitter_time_raw: '', event_type: EGV, glucose_raw: '108', glucose_unit: mg/dL, transmitter_id: S}
    expect:
      rows:
        - {reading_at: '2025-10-25 23:55:30+00', reading_date: '2025-10-26', glucose_raw: '6.0', local_time_ambiguous: false, local_time_invalid: false}
        - {reading_at: '2025-10-26 00:00:30+00', reading_date: '2025-10-26', glucose_raw: '6.1', local_time_ambiguous: true,  local_time_invalid: false}
        - {reading_at: '2025-10-26 00:30:30+00', reading_date: '2025-10-26', glucose_raw: '6.2', local_time_ambiguous: true,  local_time_invalid: false}
        - {reading_at: '2025-10-26 00:55:30+00', reading_date: '2025-10-26', glucose_raw: '6.3', local_time_ambiguous: true,  local_time_invalid: false}
        - {reading_at: '2025-10-26 01:00:31+00', reading_date: '2025-10-26', glucose_raw: '6.4', local_time_ambiguous: true,  local_time_invalid: false}
        - {reading_at: '2025-10-26 01:30:31+00', reading_date: '2025-10-26', glucose_raw: '6.2', local_time_ambiguous: true,  local_time_invalid: false}
        - {reading_at: '2025-10-26 02:00:31+00', reading_date: '2025-10-26', glucose_raw: '6.6', local_time_ambiguous: false, local_time_invalid: false}
        - {reading_at: '2025-10-26 00:10:00+00', reading_date: '2025-10-26', glucose_raw: '5.0', local_time_ambiguous: true,  local_time_invalid: false}
        - {reading_at: '2025-10-26 01:10:00+00', reading_date: '2025-10-26', glucose_raw: '5.0', local_time_ambiguous: true,  local_time_invalid: false}
        - {reading_at: '2025-03-30 00:55:00+00', reading_date: '2025-03-30', glucose_raw: '7.0', local_time_ambiguous: false, local_time_invalid: false}
        - {reading_at: '2025-03-30 01:30:00+00', reading_date: '2025-03-30', glucose_raw: '7.1', local_time_ambiguous: false, local_time_invalid: true}
        - {reading_at: '2025-03-30 01:00:00+00', reading_date: '2025-03-30', glucose_raw: '7.2', local_time_ambiguous: false, local_time_invalid: false}
        - {reading_at: '2025-07-01 10:00:00+00', reading_date: '2025-07-01', glucose_raw: '108', local_time_ambiguous: false, local_time_invalid: false}

  - name: stg_share_readings_conversion
    model: stg_share_readings
    description: >
      Share instants are exact (no DST guessing): the 02:30 UTC reading on the autumn night
      lands at 03:30 local winter time. mg/dL is converted with 18.016; values outside
      40-400 mg/dL become censored Low/High at the sensor limits.
    given:
      - input: source('raw', 'share_readings')
        rows:
          - {reading_at: '2025-10-25 21:55:00+00', value_mgdl: 108}
          - {reading_at: '2025-10-25 22:05:00+00', value_mgdl: 39}
          - {reading_at: '2025-10-26 02:30:00+00', value_mgdl: 401}
    expect:
      rows:
        - {reading_at: '2025-10-25 21:55:00+00', reading_at_local: '2025-10-25 23:55:00', glucose_mmol: 6.0, censored: null}
        - {reading_at: '2025-10-25 22:05:00+00', reading_at_local: '2025-10-26 00:05:00', glucose_mmol: 2.2, censored: 'low'}
        - {reading_at: '2025-10-26 02:30:00+00', reading_at_local: '2025-10-26 03:30:00', glucose_mmol: 22.2, censored: 'high'}
