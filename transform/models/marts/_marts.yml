    meta:
      construct: level 2 hyperglycaemia events (> 13.9 for >= 15 min)
      source_standard: Battelino et al., Lancet Diabetes Endocrinol 2023;11:42, Table 4
      valid_range: '>= 0'
      iglu_function: episode_calculation (event logic)
      does_not_measure: severity or symptoms of each event
      epistemics: derived
  - name: n_hypo_level1_events_clean
    description: As n_hypo_level1_events, leaving out events with a flagged artefact.
    data_type: bigint
    meta:
      construct: hypo_level1 events, artefacts removed
      source_standard: Battelino et al., Lancet Diabetes Endocrinol 2023;11:42, Table 4
      valid_range: '>= 0'
      iglu_function: null
      does_not_measure: events the heuristic flags miss
      epistemics: interpreted
  - name: n_hypo_level2_events_clean
    description: As n_hypo_level2_events, leaving out events with a flagged artefact.
    data_type: bigint
    meta:
      construct: hypo_level2 events, artefacts removed
      source_standard: Battelino et al., Lancet Diabetes Endocrinol 2023;11:42, Table 4
      valid_range: '>= 0'
      iglu_function: null
      does_not_measure: events the heuristic flags miss
      epistemics: interpreted
  - name: is_ill
