version: 2

models:
  - name: stg_cgm_readings
    description: One glucose reading per row, mmol/L, deduplicated across overlapping exports.
    columns:
      - name: reading_id
        tests: [unique, not_null]
      - name: reading_at
        description: The instant of the reading (timestamptz, UTC). Use for ordering, gaps and durations.
        tests: [not_null]
      - name: reading_at_local
        description: Wall-clock time in var('local_timezone'), as shown on the receiver. Use for time of day.
        tests: [not_null]
      - name: reading_date
        description: Local calendar date.
        tests: [not_null]
      - name: local_time_invalid
        description: The exported wall time does not exist locally (spring-forward hour). Read as summer time.
        tests: [not_null]
      - name: glucose_mmol
        description: Glucose in mmol/L. Censored readings are set to the sensor limit. A null here means an unparseable export value.
        tests:
          - not_null
          - between:
              arguments:
                min_value: 2.2
                max_value: 22.2
      - name: censored
        tests:
          - accepted_values:
              arguments:
                values: ['low', 'high']

  - name: int_cgm_segments
    description: Readings with gaps, contiguous segments and inferred sensor sessions.
    columns:
      - name: reading_id
        tests: [unique, not_null]
      - name: gap_minutes
        tests:
          - between:
              arguments:
                min_value: 0
                max_value: 1000000

  - name: int_cgm_flagged
    description: Readings with artefact flags. Nothing is removed.
    columns:
      - name: reading_id
        tests: [unique, not_null]
      - name: flag_compression_low
        description: "Interpreted (heuristic): night-time run below 3.9 mmol/L, reached by a drop of 2.0+ mmol/L within ~20 min, lasting at most 45 min, recovering to within 1.0 of the pre-drop value within 45 min."
        tests: [not_null]
      - name: flag_implausible_jump
        tests: [not_null]

  - name: int_glycaemic_events
    description: >
      Consensus 2023 hypo- and hyperglycaemic events (Battelino et al., Lancet Diabetes Endocrinol
      2023, Table 4), one row per event, on raw readings within recording segments. Identical to
      iglu's event classifier on the same readings (make validate).
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ['hypo_level1', 'hypo_level2', 'hypo_extended', 'hyper_level1', 'hyper_level2']
      - name: n_readings
        tests:
          - between:
              arguments:
                min_value: 3
                max_value: 1000000
      - name: contains_artefact
        description: The event includes a reading flagged as compression low or implausible jump.
        tests: [not_null]

  - name: fct_glucose_daily
    description: Daily CGM metrics per international consensus, on all readings and without artefacts.
    columns:
      - name: reading_date
        tests: [unique, not_null]
      - name: coverage_pct
        description: Share of expected 5-minute readings for the local day's real length (276 in spring, 288, 300 in autumn). Above 100 means more readings than the clock allows, for example two sensors running in parallel during a G7 grace period.
        tests:
          - between:
              arguments:
                min_value: 0
                max_value: 100
              config:
                severity: warn
      - name: tir_pct
        tests:
          - between:
              arguments:
                min_value: 0
                max_value: 100

  - name: stg_personal_events
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: start_date
        tests: [not_null]

  - name: fct_day_context
    description: Context per day from the event log, plus inferred sensor changes from the CGM data.
    columns:
      - name: reading_date
        tests: [unique, not_null]

  - name: mart_analysis_days
    description: The starting table for analyses. One row per day with glucose metrics and context.
    columns:
      - name: reading_date
        tests: [unique, not_null]
