name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install exactly the locked versions
        run: uv sync --locked
      - name: Code limits (complexity, nesting, size, security)
        run: uv run ruff check --output-format=github src tests analyses
      - name: Architecture (cycles, layers, analysis never reads collection code)
        run: uv run lint-imports
      - name: dbt project parses (cycles, broken refs)
        run: cd transform && uv run dbt parse --profiles-dir .
      - name: Pipeline on synthetic data (data tests, unit tests, contracts)
        run: make demo
      - name: Python tests, including ontology and statistical gates
        run: make test
      - name: Metrics match iglu (stored reference)
        run: make validate
      - name: Example analysis end to end
        run: make example
      - name: Example study result reproduces exactly
        run: make reproduce

  iglu:
    # Independent check on every push: iglu computes the same metrics in R from the same readings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::iglu
      - run: uv sync --locked
      - run: make demo
      - name: Metrics match iglu (live, R)
        run: make validate
