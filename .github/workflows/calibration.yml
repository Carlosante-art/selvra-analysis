name: Calibration

# The statistical gates with enough simulations for a narrow Monte Carlo error.
# Every push runs them small (in CI); this runs them large once a week and on demand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Type I error, coverage and power with 2000 simulated data sets
        env:
          CALIBRATION_SIMS: "2000"
        run: uv run pytest -q tests/test_calibration.py
