[project]
name = "selvra-analysis"
version = "0.1.0"
description = "Pre-registered, reproducible analyses of personal CGM data, built on the Selvra protocol's epistemic principles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "dbt-duckdb>=1.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selvra_analysis"]

[tool.ruff]
line-length = 100
